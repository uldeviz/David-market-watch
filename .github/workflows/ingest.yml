name: Market Watch — Ingestion

on:
  schedule:
    # Ogni 5 minuti (minimo intervallo affidabile su GitHub Actions).
    # Nota: durante picchi di carico GitHub puo' ritardare l'esecuzione di
    # qualche minuto — normale, non e' un bug.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # permette run manuale da tab "Actions"

concurrency:
  group: market-watch-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_THRESHOLD: ${{ vars.ALERT_THRESHOLD }}
          LOOKBACK_MINUTES: "20"
          # Opzionale: alza il limite giornaliero gratuito di MyMemory (la
          # traduzione funziona anche senza, con un limite piu' basso).
          TRANSLATE_CONTACT_EMAIL: ${{ secrets.TRANSLATE_CONTACT_EMAIL }}
        run: node scripts/ingest.mjs
